# 개발용 PostgreSQL. 배포 서버(scripts/deploy_postgres_cloud.sh)와 같은 이미지를 써서 개발과 배포의 DB를 맞춘다.
# 실행: docker compose up -d --wait   데이터는 pawpath-pgdata 볼륨에 남고, down -v를 하기 전까지 지워지지 않는다.
# 계정 정보는 저장소 최상위 .env에서 읽는다. .env.example을 참고하세요.
name: pawpath
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-pawpath}
      # 한글 정렬과 비교가 운영체제 로캘에 따라 달라지지 않게 고정한다.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      # 이 컴퓨터에서만 접속할 수 있게 연다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
    name: pawpath-pgdata

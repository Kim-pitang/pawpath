[project]
name = "pawpath-backend"
version = "0.1.0"
description = "PawPath (댕댕 산책각) - AI-Powered Personalized Pet Walking Recommendation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tzdata>=2026.6",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
